[package]
name = "pptshowtools"
version = "0.9.0"
edition = "2021"
description = "PPT Show Tools for Windows: merge presentations, PDF to PowerPoint, resize slides and extract notes"
build = "build.rs"

[[bin]]
name = "PPTShowTools"
path = "src/main.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
ttf-parser = "0.25"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Data_Pdf", "Storage", "Storage_Streams", "Foundation", "Win32_System_WinRT"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
